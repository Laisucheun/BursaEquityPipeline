# Alembic config. The migration scripts live inside the package
# (src/bursa/db/migrations) so they ship with it and `bursa db ...` can find
# them without depending on the current directory.
#
# sqlalchemy.url is deliberately NOT set here: env.py falls back to
# bursa.config.get_settings().database_url (DATABASE_URL / .env).
# Prefer `bursa db upgrade` / `bursa db stamp`; plain `alembic upgrade head`
# from the repo root works too.

[alembic]
script_location = %(here)s/src/bursa/db/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
